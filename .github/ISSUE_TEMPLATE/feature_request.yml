name: Feature request
description: Suggest a new capability or a change to an existing one.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Changes to a foundational choice may require a new or
        superseding ADR in `docs/adr/`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who runs into it, and when?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Include examples of the expected behaviour or configuration.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why you prefer the proposed one.
    validations:
      required: false
  - type: checkboxes
    id: adr
    attributes:
      label: Architecture decision
      options:
        - label: This changes a decision recorded in `docs/adr/` and needs a new or superseding ADR.
          required: false
