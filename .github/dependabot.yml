version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: daily
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
    groups:
      arch-rules:
        patterns:
          - "@azurioh/arch-rules"
      tanstack:
        patterns:
          - "@tanstack/*"
      tooling:
        patterns:
          - "@biomejs/biome"
          - turbo
          - knip
          - lefthook
          - "@commitlint/*"
          - typescript
          - vitest
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns:
          - "*"
