name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - staging
      - demo
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check
        run: pnpm check

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Browser binaries are not cached: Playwright's CI guide notes that restoring them takes as
      # long as downloading them, and the system dependencies cannot be cached anyway.
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      # test:e2e depends on build (turbo.json); Playwright serves the production build. The
      # variables the server needs come from webServer.env in apps/web/playwright.config.ts.
      - name: End-to-end tests
        run: pnpm exec turbo run test:e2e --filter=web

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  agents-md:
    name: agents-md
    runs-on: ubuntu-latest
    env:
      # claude-conventions has no release tag yet, so neither Dependabot nor any tag tracks this
      # ref: bump it by hand (.claude/rules/workflow.md).
      CONVENTIONS_SHA: b3af758b520acf7408278e45488528361ac01db2
      YQ_VERSION: v4.54.1
      YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout claude-conventions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azurioh/claude-conventions
          ref: ${{ env.CONVENTIONS_SHA }}
          path: .claude-conventions
          persist-credentials: false

      - name: Install yq
        run: |
          curl -fsSL -o "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          printf '%s  %s\n' "$YQ_SHA256" "$RUNNER_TEMP/yq" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
          yq --version

      - name: Check AGENTS.md is up to date
        run: .claude-conventions/plugins/conventions/scripts/agents-md.sh --check --repo "$GITHUB_WORKSPACE"
