name: Release Please

on:
  push:
    branches:
      - main

# The GitHub App token below does every write; GITHUB_TOKEN stays read-only. A pull request
# opened with GITHUB_TOKEN does not trigger workflows, so its required checks would never run.
permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bracket syntax: the per-path output keys contain '/' and '--'.
    outputs:
      arch-rules-release-created: ${{ steps.release.outputs['packages/arch-rules--release_created'] }}
      arch-rules-tag-name: ${{ steps.release.outputs['packages/arch-rules--tag_name'] }}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release commit lands on main only (merge commit from the release pull request), so it is
      # brought back to staging and demo; otherwise the next promotion would conflict on CHANGELOG.md
      # and the version files. staging accepts squash merges only, which keeps it linear; demo takes a
      # merge commit, which makes main an ancestor of demo so the next demo → main promotion only
      # carries new commits (ADR 0006). A branch that already contains main is skipped, because
      # GitHub refuses a pull request with no commits between the two branches.
      - name: Back-merge main into staging and demo
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          back_merge() {
            local base="$1" method="$2" number url
            if [[ "$(gh api "repos/$REPO/compare/$base...main" --jq '.ahead_by')" == "0" ]]; then
              echo "$base already contains main, nothing to back-merge."
              return
            fi
            number="$(gh pr list --repo "$REPO" --head main --base "$base" --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$number" ]]; then
              url="$(gh pr create --repo "$REPO" --head main --base "$base" \
                --title "chore: back-merge main into $base" \
                --body "Brings the release commit from main back into $base. Opened automatically after a release; merges itself once the required checks pass.")"
              number="${url##*/}"
            fi
            gh pr merge "$number" --repo "$REPO" --auto "--$method"
          }
          back_merge staging squash
          back_merge demo merge

  # npm trusted publishing (OIDC, id-token: write): no npm token is stored anywhere. Trusted
  # publishing can only be configured for a package that already exists, so the first version is
  # published by hand (packages/arch-rules/README.md, "Maintainers: first publish").
  publish-arch-rules:
    name: publish-arch-rules
    needs: release-please
    if: ${{ needs.release-please.outputs.arch-rules-release-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE: "@azurioh/arch-rules"
    steps:
      # A 404 means the hand-made first publish has not happened yet: skip with a notice so the
      # run on main stays green. Any other registry error fails the job.
      - name: Check the package exists on npm
        id: registry
        run: |
          if output="$(npm view "$PACKAGE" version 2>&1)"; then
            echo "Latest published version: $output"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' <<< "$output"; then
            echo "::notice title=$PACKAGE not published yet::Publish the first version by hand, see the section \"Maintainers: first publish\" in packages/arch-rules/README.md. Later versions are published by this job."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi

      - name: Checkout the release tag
        if: ${{ steps.registry.outputs.published == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.arch-rules-tag-name }}
          persist-credentials: false

      # pnpm and Node from .node-version, then pnpm install --frozen-lockfile.
      - name: Setup
        if: ${{ steps.registry.outputs.published == 'true' }}
        uses: ./.github/actions/setup

      - name: Build and test
        if: ${{ steps.registry.outputs.published == 'true' }}
        run: pnpm exec turbo run build test --filter="$PACKAGE"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Check the npm version
        if: ${{ steps.registry.outputs.published == 'true' }}
        run: |
          required="11.5.1"
          current="$(npm --version)"
          if [[ "$(printf '%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]]; then
            echo "::error::npm $current is older than $required, the minimum for trusted publishing."
            exit 1
          fi
          echo "npm $current"

      # npm publish does not rewrite workspace: ranges; pnpm pack writes a tarball with them
      # resolved, and npm publishes that tarball with provenance.
      - name: Pack and publish
        if: ${{ steps.registry.outputs.published == 'true' }}
        working-directory: packages/arch-rules
        run: |
          pack_dir="$RUNNER_TEMP/arch-rules-pack"
          mkdir -p "$pack_dir"
          pnpm pack --pack-destination "$pack_dir"
          tarballs=("$pack_dir"/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "::error::Expected exactly one tarball in $pack_dir."
            exit 1
          fi
          npm publish "${tarballs[0]}" --provenance --access public
