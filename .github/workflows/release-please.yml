name: Release Please

on:
  push:
    branches:
      - main

# The GitHub App token below does every write; GITHUB_TOKEN stays read-only. A pull request
# opened with GITHUB_TOKEN does not trigger workflows, so its required checks would never run.
permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release commit lands on main only (merge commit from the release pull request), so it is
      # brought back to staging and demo; otherwise the next promotion would conflict on CHANGELOG.md
      # and the version files. staging accepts squash merges only, which keeps it linear; demo takes a
      # merge commit, which makes main an ancestor of demo so the next demo → main promotion only
      # carries new commits (ADR 0006). A branch that already contains main is skipped, because
      # GitHub refuses a pull request with no commits between the two branches.
      - name: Back-merge main into staging and demo
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          back_merge() {
            local base="$1" method="$2" number url
            if [[ "$(gh api "repos/$REPO/compare/$base...main" --jq '.ahead_by')" == "0" ]]; then
              echo "$base already contains main, nothing to back-merge."
              return
            fi
            number="$(gh pr list --repo "$REPO" --head main --base "$base" --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$number" ]]; then
              url="$(gh pr create --repo "$REPO" --head main --base "$base" \
                --title "chore: back-merge main into $base" \
                --body "Brings the release commit from main back into $base. Opened automatically after a release; merges itself once the required checks pass.")"
              number="${url##*/}"
            fi
            gh pr merge "$number" --repo "$REPO" --auto "--$method"
          }
          back_merge staging squash
          back_merge demo merge
